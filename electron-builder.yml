appId: com.idagcc.catchthephish
productName: Catch the Phish
asar: true
asarUnpack:
  - dist/video/**/*
  - dist/audio/**/*
directories:
  output: release
files:
  - dist/**/*
  - electron/main.cjs
  - electron/asset-protocol.cjs
  - package.json
afterPack: electron/after-pack.cjs
afterSign: electron/after-sign.cjs
win:
  target:
    - target: zip
      arch:
        - x64
  artifactName: Catch-the-Phish-${version}-Windows-${arch}.${ext}
  signAndEditExecutable: false
portable:
  requestExecutionLevel: user
mac:
  target:
    - target: zip
      arch:
        - arm64
  artifactName: Catch-the-Phish-${version}-Mac-${arch}.${ext}
  category: public.app-category.education
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
